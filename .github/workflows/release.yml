# Publishes a GitHub release for each version tag (v1.2.3): builds the
# package, signs it for Firefox as an unlisted add-on on addons.mozilla.org
# and attaches the signed .xpi, the .zip and updates.json to the release.
# Firefox finds new versions through updates.json of the latest release
# (update_url in the manifest).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # all tags, for the version check
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Check the version
        run: |
          version=$(node -p 'require("./extension/manifest.json").version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
          previous=$(git tag --list 'v*' | grep -vxF "$GITHUB_REF_NAME" | sort -V | tail -n 1)
          if [ -n "$previous" ] && [ "$(printf '%s\n' "$previous" "$GITHUB_REF_NAME" | sort -V | tail -n 1)" != "$GITHUB_REF_NAME" ]; then
            echo "::error::$GITHUB_REF_NAME is not newer than $previous"
            exit 1
          fi

      - run: npx --yes web-ext@10 lint --source-dir extension --self-hosted --warnings-as-errors
      - run: npx --yes web-ext@10 build --source-dir extension --artifacts-dir dist

      - name: Sign for Firefox
        run: npx --yes web-ext@10 sign --source-dir extension --artifacts-dir dist --channel unlisted
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}

      - name: Create the release
        run: |
          xpi="aiub_captcha_solver-${GITHUB_REF_NAME#v}.xpi"
          mv dist/*.xpi "dist/$xpi"
          XPI="$xpi" node -e '
            const crypto = require("crypto");
            const fs = require("fs");
            const { version, browser_specific_settings: { gecko } } = require("./extension/manifest.json");
            const { XPI, GITHUB_SERVER_URL, GITHUB_REPOSITORY, GITHUB_REF_NAME } = process.env;
            const hash = crypto.createHash("sha256").update(fs.readFileSync(`dist/${XPI}`)).digest("hex");
            const update = {
              version,
              update_link: `${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${XPI}`,
              update_hash: `sha256:${hash}`,
            };
            fs.writeFileSync("dist/updates.json", JSON.stringify({ addons: { [gecko.id]: { updates: [update] } } }, null, 2) + "\n");
          '
          gh release create "$GITHUB_REF_NAME" dist/*.xpi dist/*.zip dist/updates.json --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
